name: Test

on: [push, pull_request]

jobs:
  build:
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        # Every combination is listed explicitly instead of building a cross
        # product: each supported Python, each supported websockets major and
        # each supported protobuf major is covered, without the job count
        # exploding. The axis under test varies, the rest stays at the newest
        # version that Python can use.
        include:
          # Every supported Python version.
          - os: ubuntu-latest
            python-version: "3.10"
            # websockets 17.x requires Python >= 3.11.
            websockets-version: "16.1.1"
            protobuf-version: "7.35.1"
          - os: ubuntu-latest
            python-version: "3.11"
            websockets-version: "17.0.1"
            protobuf-version: "7.35.1"
          - os: ubuntu-latest
            python-version: "3.12"
            websockets-version: "17.0.1"
            protobuf-version: "7.35.1"
          - os: ubuntu-latest
            python-version: "3.13"
            websockets-version: "17.0.1"
            protobuf-version: "7.35.1"
          - os: ubuntu-latest
            python-version: "3.14"
            websockets-version: "17.0.1"
            protobuf-version: "7.35.1"

          # Every supported websockets major (17.x is covered above).
          - os: ubuntu-latest
            python-version: "3.13"
            websockets-version: "15.0"
            protobuf-version: "7.35.1"
          - os: ubuntu-latest
            python-version: "3.13"
            websockets-version: "16.1.1"
            protobuf-version: "7.35.1"

          # Every supported protobuf major (7.x is covered above).
          - os: ubuntu-latest
            python-version: "3.13"
            websockets-version: "17.0.1"
            protobuf-version: "5.29.6"
          - os: ubuntu-latest
            python-version: "3.13"
            websockets-version: "17.0.1"
            protobuf-version: "6.33.6"

          # The oldest supported everything.
          - os: ubuntu-latest
            python-version: "3.10"
            websockets-version: "15.0"
            protobuf-version: "5.29.6"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Centrifugo
        run: docker compose up -d --wait

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "protobuf==${{ matrix.protobuf-version }}"
          pip install "websockets==${{ matrix.websockets-version }}"
          make dev

      - name: Run tests
        run: |
          make test

      - name: Run linter
        run: |
          make lint-ci
