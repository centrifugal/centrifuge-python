[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "centrifuge-python"
description = "WebSocket SDK for Centrifugo (and any Centrifuge-based server) on top of Python asyncio library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Alexander Emelin (Centrifugal Labs LTD)", email = "" },
    { name = "Katant Savelev", email = "" }
]
keywords = [
    "Centrifugo",
    "Centrifuge",
    "WebSocket",
    "Pub/Sub",
    "Realtime",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    # 15.0 is the floor: it is the first release with proxy support, so the SDK
    # does not have to detect whether the proxy option can work at all. Note that
    # 14.1 was the previous floor for Connection.close_code / close_reason, which
    # the client uses to turn a server close frame into a disconnect code.
    "websockets>=15.0,<18.0.0",
    # The protobuf 4.x line is out of support since March 2025, and it can not be
    # used on Python 3.14 at all. 5.29.6 is the oldest release of the 5.x line
    # without GHSA-8qvm-5x2c-j2w7 (DoS while parsing, which is this SDK's own
    # decode path) and GHSA-7gcm-g887-7qv7 (JSON recursion depth bypass). The 5.x
    # line is kept, even though it is out of support too, because packages which
    # cap protobuf below 6 are still common and the SDK has to install next to
    # them.
    "protobuf>=5.29.6,<8.0.0",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ruff~=0.16.1",
    "pre-commit~=4.6",
]
# Tooling for `make proto`, kept out of dev: grpcio-tools pins protobuf<6 and
# would downgrade the protobuf runtime when installed — dev environments and the
# CI protobuf version matrix must not be affected by it. The 1.71.x pin is not
# staleness: newer protoc emits gencode which refuses to load on older protobuf
# runtimes, and this is the newest whose output works with every runtime the
# dependencies above allow. See the Makefile for the compatibility table and
# https://github.com/centrifugal/centrifuge-python/issues/29.
proto = [
    "grpcio-tools~=1.71.0",
]

[tool.hatch.envs.default]
features = ["dev"]
post-install-commands = ["pre-commit install"]

[tool.hatch.envs.default.scripts]
reformat = "ruff format ."
lint = "ruff check . --fix"

[tool.hatch.build.targets.wheel]
packages = ["centrifuge"]

[[tool.hatch.envs.test.matrix]]
python = ["310", "311", "312", "313", "314"]

[tool.hatch.version]
path = "centrifuge/__meta__.py"

[tool.ruff]
preview = true
line-length = 99
exclude = [
    "centrifuge/protocol/client_pb2.py",
    "tests/data/5/delta",
    "tests/data/5/target",
    "tests/data/5/origin",
    "tests/data/4/delta",
    "tests/data/3/delta",
    "tests/data/1/delta",
]

[tool.ruff.lint]
select = [
    "PL", # pylint
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "C90", # mccabe
    "N", # pep8-naming
    "YTT", # flake8-2020
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT", # flake8-pytest-style
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PGH", # pygrep-hooks
    "RSE", # flake8-raise
    "RUF", # ruff
]
ignore = [
    # Ruff's preview suppression syntax (`# ruff: ignore[rule-name]`) is not used
    # here - plain `# noqa` comments are understood by every other tool as well.
    "noqa-comments",
    "too-many-arguments", # Aligns with other SDKs.
    "too-many-positional-arguments", # Aligns with other SDKs.
    "complex-structure", # TODO: solve this one.
    "too-many-return-statements", # TODO: solve this one.
    "too-many-statements", # TODO: solve this one.
    "too-many-branches", # TODO: solve this one.
    "magic-value-comparison", # TODO: solve this one.
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "pytest-unittest-assertion", # unittest-style assertions are the style here.
    "assert",
    "unused-async", # Event handlers must be async even when they do not await.
    "too-many-statements-in-try-clause",
]
"example.py" = [
    "hardcoded-password-string", # Yes, token is hard-coded in the example.
    "no-self-use", # Seems fine for the example.
    "unused-async", # Token callbacks are awaited by the SDK, they must be async.
]
